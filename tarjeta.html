:root{--bg:#F5F1EA;--card:#FDFBF7;--line:#E4DCCB;--fg:#201C16;--muted:#6E675B;--accent:#A8824F;--on-accent:#201C16;}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--fg);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.15rem;}
.pass{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:36px 28px 28px;text-align:center;box-shadow:0 18px 40px -22px rgba(32,28,22,.35);}
.logo{width:78%;height:auto;display:block;margin:0 auto 18px}
.logo-dark{display:none}
@media(prefers-color-scheme:dark){.logo-light{display:none}.logo-dark{display:block}}
.tag{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:1.2rem;margin:0 0 6px}
.lead{color:var(--accent);margin:0 0 26px;font-size:1.1rem}
.btns{display:grid;gap:10px;margin-bottom:26px}
.btn{display:block;padding:14px 16px;border-radius:999px;border:1px solid var(--accent);color:var(--fg);text-decoration:none;font-family:'Jost',sans-serif;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase}
.btn.primary{background:var(--accent);color:#201C16}
.qrbox{border-top:1px solid var(--line);padding-top:22px}
.qr{width:150px;height:150px;color:#201C16;background:#FDFBF7;padding:10px;box-sizing:content-box;border-radius:10px;display:block;margin:0 auto 12px}
.small{font-family:'Jost',sans-serif;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0}
.url{font-family:'Jost',sans-serif;font-size:.8rem;color:var(--muted);margin:14px 0 0}
</style>
