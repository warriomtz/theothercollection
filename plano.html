<style>
  /* Layout concept: a single centered column (max 1120px) stacking quiet, generous sections; the hero carries the wordmark at full size, later sections narrow to a readable measure. */
  :root{
    --bg:#F5F1EA;
    --surface:#FDFBF7;
    --surface-line:#E4DCCB;
    --fg:#201C16;
    --fg-muted:#6E675B;
    --accent:#A8824F;
    --accent-soft:#EFE6D3;
    --font-display:'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-body:'Cormorant Garamond', Georgia, serif;
    --font-label:'Jost', 'Helvetica Neue', Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17140F;
      --surface:#1E1A14;
      --surface-line:#352F24;
      --fg:#F2ECE0;
      --fg-muted:#AFA695;
      --accent:#C9A96A;
      --accent-soft:#2B2619;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17140F;
    --surface:#1E1A14;
    --surface-line:#352F24;
    --fg:#F2ECE0;
    --fg-muted:#AFA695;
    --accent:#C9A96A;
    --accent-soft:#2B2619;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  :root{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ :root{scroll-behavior:auto;} }
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font-body);
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .wrap{max-width:1120px;margin:0 auto;padding-inline:24px;}
  .measure{max-width:640px;}

  /* ---------- nav ---------- */
  .nav{
    position:sticky;
    top:0;
    z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--surface-line);
  }
  .nav-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-block:14px;
  }
  .nav-mark{height:22px;width:auto;}
  .nav-right{display:flex;align-items:center;gap:18px;}
  .lang-btn{
    font-family:var(--font-label);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    background:none;
    border:1px solid var(--surface-line);
    color:var(--fg);
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .lang-btn:hover{border-color:var(--accent);color:var(--accent);}
  .nav-ig{
    font-family:var(--font-label);
    font-size:12px;
    letter-spacing:.1em;
    text-decoration:none;
    color:var(--fg-muted);
    display:none;
  }
  .nav-ig:hover{color:var(--accent);}
  @media(min-width:620px){ .nav-ig{display:inline;} }

  /* ---------- hero ---------- */
  .hero{
    padding-block:clamp(56px,10vw,104px) clamp(48px,8vw,88px);
    text-align:center;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-label);
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--fg-muted);
    margin-bottom:28px;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--surface-line);}
  .hero-mark{max-width:520px;width:72%;margin:0 auto 30px;}
  .logo-dark{display:none;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .logo-light{display:none;}
    :root:not([data-theme="light"]) .logo-dark{display:block;}
  }
  :root[data-theme="dark"] .logo-light{display:none;}
  :root[data-theme="dark"] .logo-dark{display:block;}

  .hero-tagline{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.25rem,2.6vw,1.6rem);
    color:var(--fg);
    max-width:580px;
    margin:0 auto 18px;
    text-wrap:balance;
  }
  .hero-sub{
    max-width:480px;
    margin:0 auto 34px;
    color:var(--fg-muted);
    font-size:1.15rem;
  }
  .btn{
    font-family:var(--font-label);
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    border-radius:2px;
    transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--accent);color:#1A1410;}
  .icon-link{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:46px;
    height:46px;
    border-radius:999px;
    border:1px solid var(--surface-line);
    color:var(--fg);
    transition:border-color .15s ease, color .15s ease, transform .15s ease;
  }
  .icon-link:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}
  .icon-ig{width:20px;height:20px;}
  .contact .icon-link{color:inherit;border-color:color-mix(in srgb, currentColor 35%, transparent);}
  .contact .icon-link:hover{color:var(--accent);border-color:var(--accent);}

  /* ---------- section shell ---------- */
  section{padding-block:clamp(48px,8vw,88px);}
  .section-head{max-width:640px;margin:0 auto 44px;text-align:center;}
  .section-label{
    font-family:var(--font-label);
    font-size:12px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 12px;
  }
  .section-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(1.6rem,3.4vw,2.2rem);
    margin:0;
    text-wrap:balance;
  }

  /* ---------- about ---------- */
  .about{border-top:1px solid var(--surface-line);}
  .about-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:40px;
    align-items:start;
  }
  @media(min-width:760px){ .about-grid{grid-template-columns:1.1fr 1fr;gap:64px;} }
  .about-quote{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.5rem,3.2vw,2rem);
    line-height:1.35;
    margin:0;
    text-wrap:balance;
  }
  .about-quote span{color:var(--accent);}
  .about-body p{color:var(--fg-muted);font-size:1.1rem;margin:0 0 16px;}
  .about-body p:last-child{margin-bottom:0;}

  /* ---------- services ---------- */
  .services{background:var(--surface);border-top:1px solid var(--surface-line);border-bottom:1px solid var(--surface-line);}
  .card-grid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--surface-line);border:1px solid var(--surface-line);}
  @media(min-width:760px){ .card-grid{grid-template-columns:repeat(3,1fr);} }
  .card-grid-2{max-width:720px;margin-inline:auto;}
  @media(min-width:620px){ .card-grid-2{grid-template-columns:repeat(2,1fr);} }
  .card{background:var(--surface);padding:36px 28px;display:flex;flex-direction:column;gap:14px;min-width:0;}
  .card-icon{width:30px;height:30px;color:var(--accent);}
  .card h3{font-family:var(--font-display);font-weight:600;font-size:1.25rem;margin:0;}
  .card p{color:var(--fg-muted);font-size:1.02rem;margin:0;flex:1;}
  .tag{
    align-self:flex-start;
    font-family:var(--font-label);
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:5px 11px;
    border-radius:999px;
    text-decoration:none;
  }
  .tag-live{background:var(--accent);color:#1A1410;transition:transform .15s ease;}
  a.tag-live:hover{transform:translateY(-1px);}
  .tag-soon{border:1px solid var(--surface-line);color:var(--fg-muted);}

  /* ---------- collection / properties ---------- */
  .collection-section{scroll-margin-top:84px;}
  .collection-grid{display:grid;grid-template-columns:1fr;gap:22px;}
  @media(min-width:620px){ .collection-grid{grid-template-columns:repeat(2,1fr);max-width:880px;margin-inline:auto;} }
  .property{
    position:relative;
    border:1px solid var(--surface-line);
    aspect-ratio:4/5;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:20px;
    min-width:0;
  }
  .property-bg{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 90% at 15% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      linear-gradient(155deg, var(--surface) 0%, var(--accent-soft) 100%);
    z-index:0;
  }
  .property > *{position:relative;z-index:1;}
  .property-index{font-family:var(--font-label);font-size:12px;letter-spacing:.14em;color:var(--fg-muted);}
  .property-foot{display:flex;flex-direction:column;gap:6px;}
  .property-name{font-family:var(--font-display);font-style:italic;font-size:1.2rem;}
  .property-tag{font-family:var(--font-label);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
  .property > .property-bg{position:absolute;inset:0;z-index:0;}
  .property-photo{background-size:cover;background-position:center;}
  .property-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,20,15,.35) 0%,rgba(23,20,15,0) 30%,rgba(23,20,15,0) 55%,rgba(23,20,15,.72) 100%);}
  .property-photo ~ .property-index,.property-photo ~ .property-foot .property-name{color:#F5F1EA;}
  .property-photo ~ .property-foot .property-tag{color:#E6CFA3;}

  /* ---------- contact ---------- */
  .contact{background:var(--fg);color:var(--bg);}
  :root[data-theme="dark"] .contact{background:var(--surface);color:var(--fg);}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .contact{background:var(--surface);color:var(--fg);} }
  .contact-inner{text-align:center;}
  .contact p{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:500;
    color:inherit;
    max-width:520px;
    margin:0 auto 32px;
    font-size:clamp(1.3rem,2.6vw,1.75rem);
    text-wrap:balance;
  }
  .handle-row{
    display:inline-flex;
    align-items:center;
    gap:12px;
    background:color-mix(in srgb, var(--bg) 10%, transparent);
    border:1px solid color-mix(in srgb, var(--bg) 24%, transparent);
    padding:12px 10px 12px 20px;
    border-radius:999px;
    margin-bottom:28px;
    flex-wrap:wrap;
    justify-content:center;
  }
  :root[data-theme="dark"] .handle-row{background:color-mix(in srgb, var(--fg) 6%, transparent);border-color:var(--surface-line);}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .handle-row{background:color-mix(in srgb, var(--fg) 6%, transparent);border-color:var(--surface-line);}
  }
  .handle-text{font-family:var(--font-label);font-size:13px;letter-spacing:.08em;}
  .copy-btn{
    font-family:var(--font-label);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    background:var(--accent);
    color:#1A1410;
    border:none;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .contact-links{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;}

  /* ---------- footer ---------- */
  footer{padding-block:40px;border-top:1px solid var(--surface-line);}
  .foot-inner{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
  .foot-mark{height:16px;width:auto;opacity:.85;}
  .foot-meta{font-family:var(--font-label);font-size:11.5px;letter-spacing:.08em;color:var(--fg-muted);}
  .foot-links{display:flex;gap:18px;font-family:var(--font-label);font-size:11.5px;letter-spacing:.08em;}
  .foot-links a{text-decoration:none;color:var(--fg-muted);}
  .foot-links a:hover{color:var(--accent);}

  [data-reveal]{opacity:0;transform:translateY(14px);transition:opacity .6s ease, transform .6s ease;}
  [data-reveal].is-visible{opacity:1;transform:none;}
  @media (prefers-reduced-motion: reduce){
    [data-reveal]{opacity:1;transform:none;transition:none;}
  }
</style>
<style>
  .properties-header{padding-block:clamp(32px,6vw,48px) 0;}
  .back-link{
    font-family:var(--font-label);
    font-size:12.5px;
    letter-spacing:.08em;
    color:var(--fg-muted);
    text-decoration:none;
  }
  .back-link:hover{color:var(--accent);}
</style>
<style>
  .pd-intro{padding-block:28px 8px;}
  .pd-title{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:clamp(2.6rem,7vw,4.2rem);line-height:1.05;margin:4px 0 10px;}
  .pd-tower{font-family:var(--font-body);color:var(--fg-muted);font-size:1.15rem;margin:0 0 14px;}
  .pd-tag{font-family:var(--font-label);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0;}
  .pd-gallery{padding-block:28px 56px;}
  .gallery{display:grid;grid-template-columns:1fr;gap:14px;align-items:start;}
  @media(min-width:700px){ .gallery{grid-template-columns:1fr 1fr;} .gallery .wide{grid-column:1 / -1;} }
  .gallery button{display:block;width:100%;padding:0;margin:0;border:1px solid var(--surface-line);background:var(--surface);cursor:zoom-in;line-height:0;}
  .gallery button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .gallery img{width:100%;height:auto;display:block;}
  .pd-amen-gallery{padding-block:0 56px;}
  .pd-amen-gallery .section-head{margin-bottom:32px;}
  .gallery button{position:relative;}
  .gallery .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 12px;text-align:left;font-family:var(--font-label);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;line-height:1.3;color:#F5F1EA;background:linear-gradient(180deg,rgba(23,20,15,0),rgba(23,20,15,.7));pointer-events:none;}
  /* ---------- floor plan ---------- */
  .pd-plan{padding-block:clamp(48px,8vw,88px) 0;}
  .pd-plan .section-head{margin-bottom:28px;}
  .plan{margin:0 auto;width:min(100%,540px);
    --plan-line:var(--fg-muted);--plan-line-opacity:.7;--plan-label:var(--fg);--plan-label-soft:var(--fg-muted);--plan-win:var(--accent);}
  .plan svg{display:block;width:100%;height:auto;overflow:visible;}
  .plan .plan-lines{fill:var(--plan-line);opacity:var(--plan-line-opacity);}
  .plan text{font-family:var(--font-label);font-weight:400;text-anchor:middle;text-transform:uppercase;fill:var(--plan-label);}
  .plan .lg{font-size:44px;letter-spacing:.16em;}
  .plan .sm{font-size:25px;letter-spacing:.16em;fill:var(--plan-label-soft);}
  .plan .win{font-size:28px;letter-spacing:.2em;fill:var(--plan-win);}
  .plan-link{display:block;color:inherit;text-decoration:none;border-radius:4px;transition:opacity .25s ease;}
  .plan-link:hover{opacity:.82;}
  .plan-link:focus-visible{outline:2px solid var(--accent);outline-offset:8px;}
  .plan-cta{display:flex;justify-content:center;margin-top:28px;}
  .pd-details{background:var(--surface);border-top:1px solid var(--surface-line);border-bottom:1px solid var(--surface-line);}
  .pd-cols{display:grid;grid-template-columns:1fr;gap:44px;}
  @media(min-width:760px){ .pd-cols{grid-template-columns:1fr 1.3fr;gap:72px;} }
  .pd-h{font-family:var(--font-label);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 18px;}
  .facts{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:28px;}
  .facts dt,.facts dd{margin:0;padding:12px 0;border-bottom:1px solid var(--surface-line);}
  .facts dt{font-family:var(--font-label);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-muted);align-self:center;}
  .facts dd{font-size:1.1rem;}
